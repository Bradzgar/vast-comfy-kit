# AI Toolkit config for Krea 2 LoRA training (community-calibrated).
# setup-toolkit.sh substitutes @MODELS@ with your MODELS_DIR and drops this at
#   <ai-toolkit>/config/krea2_lora.yml
# Edit trigger_word, dataset folder_path, and step count before your first run.
#
# GOLDEN RULE: train on Krea-2-Raw, then apply the LoRA on Krea-2-Turbo.
# Krea 2 rules that MUST NOT be ported from FLUX recipes:
#   * timestep_type: linear   (never sigmoid/weighted)
#   * noise_scheduler: flowmatch
#   * train_text_encoder: false
#   * quantize/qfloat8 on BOTH transformer and text encoder

job: extension
config:
  name: "krea2_raw_r32_v1"
  process:
  - type: diffusion_trainer
    training_folder: /workspace/ai-toolkit/output
    sqlite_db_path: /workspace/ai-toolkit/aitk_db.db
    device: cuda
    trigger_word: "mystyle"
    performance_log_every: 10

    network:
      type: lora
      linear: 32          # rank
      linear_alpha: 32    # alpha

    save:
      dtype: bf16
      save_every: 250
      max_step_saves_to_keep: 10
      save_format: diffusers
      push_to_hub: false

    datasets:
    - folder_path: "/workspace/datasets/my-dataset"   # <-- your dataset folder
      mask_path: null
      mask_min_value: 0.1
      default_caption: ''
      caption_ext: txt
      caption_dropout_rate: 0.05
      cache_latents_to_disk: true
      is_reg: false
      network_weight: 1
      resolution:
      - 512
      - 768
      - 1024
      controls: []
      flip_x: false
      flip_y: false
      num_repeats: 1

    train:
      batch_size: 1
      steps: 2500
      gradient_accumulation: 1
      train_unet: true
      train_text_encoder: false        # keep OFF
      gradient_checkpointing: true
      noise_scheduler: flowmatch       # pairs with timestep_type
      optimizer: adamw8bit
      timestep_type: linear            # Krea 2 rule
      content_or_style: balanced
      optimizer_params:
        weight_decay: 0.0001
      cache_text_embeddings: true
      lr: 1.0e-04
      ema_config:
        use_ema: true
        ema_decay: 0.99
      dtype: bf16
      diff_output_preservation: true   # lock identity / prevent base-model pollution
      diff_output_preservation_multiplier: 1
      diff_output_preservation_class: person
      loss_type: mse

    logging:
      log_every: 1
      use_ui_logger: true

    model:
      name_or_path: "@MODELS@/krea2-raw"
      quantize: true
      qtype: qfloat8
      quantize_te: true
      qtype_te: qfloat8
      arch: krea2
      low_vram: false
      model_kwargs:
        vae_path: "@MODELS@/krea2-raw/vae"
        text_encoder_path: "@MODELS@/krea2-raw/text_encoder"
      compile: false
      layer_offloading: false
      layer_offloading_text_encoder_percent: 1
      layer_offloading_transformer_percent: 1

    sample:
      sampler: flowmatch
      sample_every: 250
      sample_start_step: 0
      width: 1024
      height: 1024
      samples:
      - prompt: "mystyle, single person, close-up head and shoulders, front view, slight smile, natural light, plain background"
      - prompt: "mystyle, single person, three-quarter view, full body, standing outdoors, daylight, photorealistic"
      - prompt: "single person, close-up head and shoulders, front view, no trigger word (control sample)"
      neg: ''
      seed: 42
      walk_seed: false
      guidance_scale: 4.0
      sample_steps: 30
      num_frames: 1
      fps: 1

meta:
  name: "krea2_raw_r32_v1"
  version: '2.0'
